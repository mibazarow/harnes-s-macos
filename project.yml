name: Harness
options:
  bundleIdPrefix: app.project-s
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"

packages:
  Markdown:
    url: https://github.com/apple/swift-markdown
    from: 0.9.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.9.0
  Tokenizers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.4.0
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.24.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Harness:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: UI
      - path: Core
      - path: Models
      - path: Services
      - path: Storage
      - path: Resources/Assets.xcassets
      - path: Resources/skills
        type: folder
        buildPhase: resources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: Markdown
        product: Markdown
      - package: GRDB
        product: GRDB
      - package: Tokenizers
        product: Tokenizers
      - package: OnnxRuntime
        product: onnxruntime
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HARNES-S
        CFBundleName: Harness
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "27.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSLocalNetworkUsageDescription: "HARNES-S подключается к локальным LLM-серверам и SSH-хостам."
        NSDocumentsFolderUsageDescription: "HARNES-S работает с файлами в выбранных рабочих папках."
        NSDesktopFolderUsageDescription: "HARNES-S работает с файлами в выбранных рабочих папках."
        NSDownloadsFolderUsageDescription: "HARNES-S работает с файлами в выбранных рабочих папках."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.project-s.swift
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Harness
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "101"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO

  HarnessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Harness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.project-s.swift.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  Harness:
    build:
      targets:
        Harness: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HarnessTests